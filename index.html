<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" onerror="var s=document.createElement('script');s.src='vendor/html2pdf.bundle.min.js';document.head.appendChild(s)"></script>
<style>
/* Layout: ledger-style workspace — narrow nav rail, working area of tables and a pipeline, edit drawer on the right, full-height document composer */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunken:#e9eeec; --line:#d5dddb; --fg:#17211f; --muted:#5b6a67;
  --accent:#1d5f6e; --accent-ink:#ffffff; --accent-soft:#dcebee;
  --chk:#6b4fbb; --chk-soft:#efeaff;
  --ok:#2f7a4b; --ok-soft:#e1f1e6; --warn:#a2620b; --warn-soft:#fbeed8; --bad:#b0352c; --bad-soft:#f8e1de;
  --paper:#ffffff; --paper-ink:#1a1a1a; --paper-line:#cfcfcf;
  --font-display:"Literata",Georgia,serif; --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --font-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#18211f; --sunken:#0d1312; --line:#2b3835; --fg:#e4ecea; --muted:#93a4a0;
  --accent:#6fb6c6; --accent-ink:#0b1517; --accent-soft:#1c3338; --chk:#b9a3ff; --chk-soft:#2a2342;
  --ok:#6cc58f; --ok-soft:#173025; --warn:#e3a54b; --warn-soft:#352812; --bad:#f08077; --bad-soft:#3a1c19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#18211f; --sunken:#0d1312; --line:#2b3835; --fg:#e4ecea; --muted:#93a4a0;
  --accent:#6fb6c6; --accent-ink:#0b1517; --accent-soft:#1c3338; --chk:#b9a3ff; --chk-soft:#2a2342;
  --ok:#6cc58f; --ok-soft:#173025; --warn:#e3a54b; --warn-soft:#352812; --bad:#f08077; --bad-soft:#3a1c19; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100%}
nav.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--font-display);font-size:19px;padding:0 10px 16px;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--font-body);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
nav.rail a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:var(--r);color:var(--fg);text-decoration:none;font-weight:500}
nav.rail a:hover{background:var(--sunken)}
nav.rail a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav.rail .count{font-family:var(--font-data);font-size:11px;color:var(--muted)}
nav.rail .sep{height:1px;background:var(--line);margin:8px 10px}
.sync{margin-top:auto;font-size:12px;color:var(--muted);padding:0 10px}
.sync.who{margin-top:4px}.sync.who:empty{display:none}
#auth{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
#auth[hidden]{display:none}
#auth .authbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
#auth h1{font-family:var(--font-display);font-size:22px;margin:0}
#auth .sub{margin:0;color:var(--muted)}
#auth form{display:flex;flex-direction:column;gap:12px}
#auth .r{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#auth .msg{color:var(--bad);font-size:13px;min-height:1em}#auth .msg[data-ok="1"]{color:var(--ok)}
#auth .qr{display:grid;place-items:center;min-height:180px;background:#fff;border-radius:var(--r)}
#auth code{font-family:var(--font-data);word-break:break-all}
main{padding-block:24px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-family:var(--font-display);font-weight:600;font-size:26px;margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 0;max-width:66ch}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 10px;font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:var(--r);cursor:pointer;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:3px 8px;font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input[type=search],.tools select{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 10px;min-width:0}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.banner[data-tone=info]{background:var(--accent-soft);color:var(--accent)}
.banner[data-tone=bad]{background:var(--bad-soft);color:var(--bad)}
.banner[data-tone=chk]{background:var(--chk-soft);color:var(--fg);border-left:4px solid var(--chk)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer}
.kpi:hover{border-color:var(--accent)}
.kpi .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .val{font-family:var(--font-data);font-size:24px;font-variant-numeric:tabular-nums}
.kpi .note{font-size:12px;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.att{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.att li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.att li:first-child{border-top:0}
.att .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .d{font-family:var(--font-data);font-size:12px;color:var(--muted)}
.funnel{display:flex;flex-direction:column;gap:8px}
.frow{display:grid;grid-template-columns:90px minmax(0,1fr) 90px;gap:10px;align-items:center;font-size:13px}
.fbar{height:10px;background:var(--sunken);border-radius:3px;overflow:hidden}
.fbar span{display:block;height:100%;background:var(--accent);border-radius:3px}
.frow .n{font-family:var(--font-data);font-size:12px;text-align:right;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunken);color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.ex{background:transparent;border:1px dashed var(--muted)}
.pill.chk{background:var(--chk);color:#fff}
tr.review td{background:var(--chk-soft)}tr.review td:first-child{box-shadow:inset 4px 0 0 var(--chk)}
.card.review{background:var(--chk-soft);border-color:var(--chk);box-shadow:inset 4px 0 0 var(--chk)}
.reviewbox{grid-column:1/-1;background:var(--chk-soft);border:1px solid var(--chk);border-radius:var(--r);padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--fg)}
.reviewbox b{color:var(--chk)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunken)}
tbody tr[data-act]{cursor:pointer} tbody tr[data-act]:hover{background:var(--sunken)}
tbody tr:last-child td{border-bottom:0}
td.num,.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums;font-size:13px}
td .sec{display:block;font-size:12px;color:var(--muted)}
.prog{display:inline-flex;gap:2px;vertical-align:middle}
.prog i{width:8px;height:8px;border-radius:2px;background:var(--line)} .prog i.on{background:var(--ok)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.lane{background:var(--sunken);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.lane header{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:13px;padding:2px 4px}
.lane header .mono{font-size:11px;color:var(--muted);font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--accent)}
.card .co{font-weight:600}
.card .meta{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap}
.card .na{font-size:12px}
.card .move{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.lane .empty{padding:12px;font-size:12px}
/* inbox */
.mail{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.mail:first-of-type{border-top:0}
.mail .from{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail .subj{overflow:hidden;text-overflow:ellipsis}
.mail .snip{color:var(--muted);font-size:13px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mail .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mail .ai{font-size:12px;color:var(--accent)}
details.other summary{cursor:pointer;padding:12px 14px;color:var(--muted);font-weight:500}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer header,.composer header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
.drawer header h3,.composer header h3{margin:0;font-family:var(--font-display);font-size:19px;font-weight:600}
.drawer form{overflow-y:auto;overflow-x:hidden;padding:16px 20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 14px;flex:1;align-content:start}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f label,.f legend{font-size:12px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:7px 9px;width:100%}
.f textarea{min-height:84px;resize:vertical}
fieldset.f{min-width:0;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px 10px;margin:0}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.checks label{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:400;color:var(--fg)}
.riskbox{grid-column:1/-1;border-radius:var(--r);padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;background:var(--sunken)}
.drawer footer,.composer footer{display:flex;gap:8px;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.drawer footer .r,.composer footer .r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gm{grid-column:1/-1;font-size:12px;color:var(--muted)}
.drawer.wide{width:min(760px,100%)}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tcard{display:flex;flex-direction:column;gap:8px}
.tname{font-size:16px;font-family:var(--font-display);font-weight:600}
.tcard p{margin:0}
.frow2{display:grid;grid-template-columns:120px minmax(0,1fr) 170px 28px;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.frow2:first-child{border-top:0}
.frow2 textarea{grid-column:span 2;min-height:54px}
.frow2 input,.frow2 select,.frow2 textarea{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:5px 6px;width:100%;font-size:13px;min-width:0}
details.help summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--accent)}
code{font-family:var(--font-data);font-size:11.5px;background:var(--sunken);padding:0 3px;border-radius:3px}
.paper table.sigt td{border:0;width:50%;padding:28px 0 0;vertical-align:top;font-size:12.5px}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px}
.docs{display:flex;flex-direction:column}
.drow{display:grid;grid-template-columns:minmax(0,1fr) 110px 150px;gap:8px;align-items:start;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.drow:first-child{border-top:0}
.drow select,.drow input,.xrow input,.xrow select{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:5px 6px;width:100%;font-size:13px;min-width:0}
.xrows{display:flex;flex-direction:column;gap:6px}
th.chk,td.chk{width:36px;padding-right:0}td.chk input{width:18px;height:18px;cursor:pointer;accent-color:var(--ok)}
tr.done td:not(.chk){color:var(--muted)}tr.done td b{text-decoration:line-through;text-decoration-color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.yearpanel{margin-top:16px}.ytable{min-width:640px}.ytable th.bar,.ytable td.bar{width:22%}
.ytable tr[data-month]{cursor:pointer}.ytable tr[data-month]:hover td{background:var(--sunken)}.ytable tr.empty td{color:var(--muted)}.ytable tr.cur td:first-child{font-weight:600}
.ytable tfoot th{border-top:2px solid var(--line);font-weight:600;text-align:left;text-transform:none;letter-spacing:0;font-size:14px;color:var(--fg);background:var(--surface);padding:10px 14px}.ytable tfoot th.num{font-family:var(--font-data);font-size:13px}
.wrow.lrow{grid-template-columns:72px 160px 104px minmax(0,1fr) 32px;grid-template-areas:"desc desc desc desc del" "incl incl incl incl incl" "qty unit price amt amt" "meta meta meta meta meta"}
.wrow.lrow .meta{grid-area:meta;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.wrow.lrow .meta input{width:auto;flex:1 1 120px}.wrow.lrow .meta .grp{flex:2 1 200px}
.wrow.lrow .meta label.chk{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted);white-space:nowrap}.wrow.lrow .meta label.chk input{flex:none;width:16px;height:16px}
#proptotal .gt{display:block;text-align:right}
.wrow.lrow .incl{grid-area:incl;font-size:12.5px}.wrow.lrow .xtra{grid-area:xtra}.wrow.lrow .amt{grid-area:amt}
.wrow.lrow input:disabled{opacity:.45}
.wrow.lrow.whead{grid-template-areas:"qty unit price amt amt"}
@media (max-width:760px){.wrow.lrow{grid-template-columns:1fr 1fr 1fr 36px;grid-template-areas:"desc desc desc del" "incl incl incl incl" "qty unit unit unit" "price price amt amt" "meta meta meta meta"}}
.lrow [data-l$=".s"]{grid-area:desc}.lrow [data-l$=".q"]{grid-area:qty}.lrow [data-l$=".u"]{grid-area:unit}.lrow [data-l$=".p"]{grid-area:price}
.wrow.lrow.whead span:nth-child(1){grid-area:qty}.wrow.lrow.whead span:nth-child(2){grid-area:unit}.wrow.lrow.whead span:nth-child(3){grid-area:price}.wrow.lrow.whead span:nth-child(4){grid-area:amt;text-align:right}
.agreedchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.agreed{background:var(--sunken);border-radius:var(--r);padding:10px 12px;gap:8px}.agreed .lbl{font-size:12px;font-weight:600;color:var(--muted)}
.agreed .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
table.mini{min-width:0;background:transparent}table.mini td{padding:4px 8px 4px 0;border-bottom:1px solid var(--line);font-size:13px}table.mini td.sec{color:var(--muted);font-size:12px}
.printhost{position:fixed;left:-10000px;top:0}
ul.plan{margin:10px 0 0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.printdoc{width:186mm;background:#fff;color:#1a1a1a;font-family:Calibri,Arial,sans-serif;font-size:10.5pt;line-height:1.35}
.printdoc .ph{display:flex;justify-content:space-between;gap:16px;font-size:9pt;color:#444;border-bottom:1px solid #bbb;padding-bottom:8px;margin-bottom:14px}.printdoc .ph .r{text-align:right}
.printdoc h1{font-size:16pt;margin:0 0 4px;font-family:Georgia,serif}.printdoc h2{font-size:11.5pt;margin:14px 0 4px;color:#1f3a5f;border-bottom:1px solid #1f3a5f;padding-bottom:2px}.printdoc .subt{font-size:12pt;color:#1f3a5f;margin:0 0 8px}.printdoc .pre{white-space:pre-wrap;margin:0 0 6px}.printdoc .meta{color:#444;margin:0 0 12px;font-size:9.5pt}
.printdoc table{width:100%;min-width:0;border-collapse:collapse;background:#fff}.printdoc th{background:#eee;color:#333;font-size:8.5pt;text-transform:uppercase;letter-spacing:.03em;text-align:left;padding:5px 6px;border-bottom:1px solid #999}
.printdoc td{padding:5px 6px;border-bottom:1px solid #ddd;vertical-align:top;font-size:10pt;color:#1a1a1a}.printdoc td .s{color:#666;font-size:9pt}.printdoc .n{text-align:right;white-space:nowrap}
.printdoc tr.w td{color:#555;font-size:9pt;border-bottom:1px dotted #ddd;padding-top:2px;padding-bottom:2px}.printdoc tr.w td:first-child{padding-left:14px}
.printdoc tfoot td,.printdoc tr.tot td{font-weight:bold;border-top:2px solid #999;border-bottom:0}.printdoc tr.grp td{background:#1f3a5f;color:#fff;font-weight:bold;font-size:10pt;padding-top:6px}
.work{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.wrow{display:grid;grid-template-columns:132px 64px 96px 88px minmax(0,1fr) 32px;grid-template-areas:"desc desc desc desc desc del" "date qty unit price amt amt";gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.wrow.whead{grid-template-areas:"date qty unit price amt amt";padding:0;border:0;font-size:11.5px;color:var(--muted);font-weight:600}
.wrow [data-w$=".desc"]{grid-area:desc}.wrow [data-w$=".d"]{grid-area:date}.wrow [data-w$=".q"]{grid-area:qty}.wrow [data-w$=".u"]{grid-area:unit}.wrow [data-w$=".p"]{grid-area:price}.wrow .amt{grid-area:amt;text-align:right}.wrow [data-act="work-del"]{grid-area:del;justify-content:center}
.wrow.whead span:nth-child(1){grid-area:date}.wrow.whead span:nth-child(2){grid-area:qty}.wrow.whead span:nth-child(3){grid-area:unit}.wrow.whead span:nth-child(4){grid-area:price}.wrow.whead span:nth-child(5){grid-area:amt;text-align:right}
.wrow input,.wrow select{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:5px 6px;width:100%;font-size:13px;min-width:0}
.wfoot{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
@media (max-width:760px){.wrow{grid-template-columns:1fr 1fr 1fr 36px;grid-template-areas:"desc desc desc del" "date qty unit unit" "price price amt amt"}.wrow.whead{display:none}}
.xrow{display:grid;grid-template-columns:130px minmax(0,1fr) 80px auto 28px;gap:6px;align-items:center}
.xrow:has(select){grid-template-columns:130px minmax(0,1fr) 80px 110px auto 28px}
.xrow label{display:flex;gap:4px;align-items:center;white-space:nowrap}
.confirm{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--bad)}
/* composer */
.composer{position:fixed;inset:0;z-index:21;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.cbody{flex:1;display:grid;grid-template-columns:360px minmax(0,1fr);min-height:0}
.copts{overflow-y:auto;padding:16px 20px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:12px}
.cprev{overflow:auto;padding:24px;background:var(--sunken)}
.items{display:flex;flex-direction:column;gap:6px}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 54px 74px 26px;gap:4px}
.irow input,.irow select{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:5px 6px;width:100%;font-size:13px;min-width:0}
.irow .lbl{font-size:11px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
/* the document itself: always paper-white, independent of theme */
.paper{background:var(--paper);color:var(--paper-ink);width:720px;max-width:none;margin:0 auto;padding:56px 60px;font-family:Georgia,"Times New Roman",serif;font-size:12.5px;line-height:1.55;box-shadow:0 1px 3px rgba(0,0,0,.15);outline:none}
.paper h1{font-family:Georgia,serif;font-size:19px;text-align:center;margin:0 0 4px;letter-spacing:.02em;color:var(--paper-ink)}
.paper .no{text-align:center;margin:0 0 22px;font-size:12px}
.paper h4{font-size:12.5px;margin:16px 0 4px;text-align:center}
.paper h5{font-size:12.5px;margin:16px 0 6px;border-bottom:1px solid var(--paper-line);padding-bottom:3px}
.paper p{margin:0 0 8px}
.paper .parties{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:0 0 18px}
.paper .parties b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.paper table{min-width:0;width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:12px}
.paper th,.paper td{border:1px solid var(--paper-line);padding:5px 7px;background:transparent;color:var(--paper-ink);text-transform:none;letter-spacing:0;font-size:12px}
.paper th{font-weight:bold;background:var(--paper)}
.paper td.r,.paper th.r{text-align:right;font-variant-numeric:tabular-nums}
.paper .fld{display:grid;grid-template-columns:200px 1fr;gap:8px;padding:5px 0;border-bottom:1px dotted var(--paper-line)}
.paper .fld span:first-child{color:#444}
.paper .sig{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:40px}
.paper .sig div{border-top:1px solid var(--paper-ink);padding-top:4px;font-size:11.5px}
.paper .small{font-size:11px;color:#444}
.paper .clause{break-inside:avoid}
.paper ul{margin:0 0 8px;padding-left:18px}
.paper ol{margin:0 0 8px;padding-left:22px}.paper ol li{margin-bottom:3px}.paper ol ol{margin:4px 0 0}
.paper h5{text-align:left}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:var(--r);z-index:30;font-weight:500;max-width:calc(100% - 32px)}
.setgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px}
.prices{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.2fr);gap:6px 10px;align-items:center}
.prices input,.prices select{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:6px 8px;width:100%}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:minmax(0,1fr)}.cbody{grid-template-columns:minmax(0,1fr);overflow-y:auto}.copts{border-right:0;overflow:visible}.cprev{overflow:visible}.setgrid{grid-template-columns:1fr 1fr}}
@media (max-width:700px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav.rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;overflow-x:auto;padding:8px max(12px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);z-index:5}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .brand,.sync,nav.rail .sep{display:none}
  nav.rail a{white-space:nowrap;gap:6px}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
  .drawer form,.setgrid,.mgrid{grid-template-columns:1fr}.checks{grid-template-columns:1fr}
  .drow{grid-template-columns:1fr 1fr}.drow>span:first-child{grid-column:1/-1}
  .xrow,.xrow:has(select){grid-template-columns:1fr 1fr}
  .frow2{grid-template-columns:1fr 1fr}.frow2 textarea{grid-column:1/-1}
  .cprev{padding:12px;overflow-x:auto}
  .mail{grid-template-columns:minmax(0,1fr)}.mail .acts{justify-content:flex-start}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>

<script type="application/json" id="default-templates">{"accounting": {"name": "Accounting – Pogodba o vodenju poslovnih knjig", "kind": "Accounting", "numFmt": "NN/YYYY", "source": "Pogodba_racunovodstvo.docx", "sl": {"title": "Pogodba o vodenju poslovnih knjig", "body": "**{{firm.name}}**, {{firm.address}}, {{firm.postcode}} {{firm.city}}, davčna številka: {{firm.taxNo}}, matična številka: {{firm.regNo}}, ki ga zastopa {{f.firmRep}}, v nadaljevanju izvajalec\n\nin\n\n**{{client.name}}**, {{client.address}}, {{client.postcode}} {{client.city}}, matična številka: {{client.regNo}}, davčna številka: {{client.taxNo}}, ki ga zastopa {{client.contact}}, v nadaljevanju naročnik\n\n# POGODBA O VODENJU POSLOVNIH KNJIG\n## Št. {{doc.number}}\n\n## I. PREDMET POGODBE\n## 1. člen\nS to pogodbo se pogodbeni stranki sporazumeta, da izvajalec za naročnika vodi poslovne knjige in opravlja druge dogovorjene storitve.\n\n## 2. člen (obseg storitev)\nObseg storitev, ki so vključene v mesečni pavšal, obsega:\n- {{f.included}}\n\n## 3. člen (Dodatne storitve in poseben obračun)\nNaslednje storitve niso vključene v osnovni pavšal in so predmet posebnega obračuna:\n- {{f.extra}}\n\n## II. OBVEZNOSTI IN ODGOVORNOST\n## 4. člen\nIzvajalec se zavezuje, da bo storitve opravljal strokovno in v skladu z veljavno zakonodajo. Naročnikove podatke bo obravnaval kot poslovno tajnost.\n\n## 5. člen\nNaročnik se zavezuje, da bo izvajalcu pravočasno in redno dostavljal verodostojno knjigovodsko dokumentacijo. Podatke za obračun plač mora naročnik posredovati najpozneje do {{f.payrollDay}} v mesecu za pretekli mesec.\n\n## III. CENA IN PLAČILNI POGOJI\n## 6. člen\nCena za osnovni obseg storitev se določi v skladu z računovodsko tarifo oziroma po dogovorjenem mesečnem pavšalu. V ceni ni vštet DDV.\n?f.fee Dogovorjeni mesečni pavšal znaša {{f.fee}} EUR brez DDV.\n\n## 7. člen\nNaročnik se zaveže račun izvajalca poravnati v roku {{f.payDays}} dni od datuma izstavitve. V primeru zamude se obračunajo zakonite zamudne obresti.\n\n## IV. ODPOVED POGODBE IN PREHOD\n## 8. člen\nOdpovedni rok pri sporazumni prekinitvi ne more biti daljši od enega meseca. Izvajalec lahko enostransko odpove pogodbo, če naročnik dvakrat zaporedoma ne poravna svojih obveznosti.\n\n## 9. člen (Stroški izpisov ob prehodu)\nV primeru odpovedi pogodbe in prehoda k drugemu izvajalcu storitev si izvajalec pridržuje pravico zaračunati pripravo izpisov poslovnih knjig in prenos dokumentacije v višini enega mesečnega pavšala. Izvajalec izroči dokumentacijo v roku 5 dni od prejema plačila vseh obveznosti.\n\n## V. KONČNE DOLOČBE\n## 10. člen\nPogodba stopi v veljavo z dnem podpisa in se uporablja od {{f.startDate}} dalje.\n\nV Rogatcu, dne {{doc.date}}\n\n|| IZVAJALEC: __________________________ \\\\ {{firm.name}} || NAROČNIK: __________________________ \\\\ {{client.contact}}"}, "en": {"title": "Bookkeeping Services Agreement", "body": "**{{firm.name}}**, {{firm.address}}, {{firm.postcode}} {{firm.city}}, Slovenia, tax number: {{firm.taxNo}}, registration number: {{firm.regNo}}, represented by {{f.firmRep}}, hereinafter the Provider\n\nand\n\n**{{client.name}}**, {{client.address}}, {{client.postcode}} {{client.city}}, registration number: {{client.regNo}}, tax number: {{client.taxNo}}, represented by {{client.contact}}, hereinafter the Client\n\n# BOOKKEEPING SERVICES AGREEMENT\n## No. {{doc.number}}\n\n## I. SUBJECT OF THE AGREEMENT\n## Article 1\nBy this Agreement the parties agree that the Provider will keep the Client's books of account and perform other agreed services.\n\n## Article 2 (Scope of services)\nThe services included in the monthly flat fee comprise:\n- {{f.included}}\n\n## Article 3 (Additional services charged separately)\nThe following services are not included in the basic flat fee and are charged separately:\n- {{f.extra}}\n\n## II. OBLIGATIONS AND LIABILITY\n## Article 4\nThe Provider undertakes to perform the services professionally and in accordance with applicable law. The Provider will treat the Client's data as a business secret.\n\n## Article 5\nThe Client undertakes to deliver authentic accounting documents to the Provider regularly and on time. The Client must provide payroll data for the previous month no later than {{f.payrollDay}} of the month.\n\n## III. PRICE AND PAYMENT TERMS\n## Article 6\nThe price for the basic scope of services is determined in accordance with the accounting tariff or the agreed monthly flat fee. VAT is not included in the price.\n?f.fee The agreed monthly flat fee is EUR {{f.fee}} excluding VAT.\n\n## Article 7\nThe Client undertakes to pay the Provider's invoices within {{f.payDays}} days of the invoice date. Statutory default interest is charged on late payments.\n\n## IV. TERMINATION AND HANDOVER\n## Article 8\nThe notice period for termination by mutual agreement may not exceed one month. The Provider may terminate the Agreement unilaterally if the Client fails to settle its obligations twice in a row.\n\n## Article 9 (Costs of ledger reports on transfer)\nIf the Agreement is terminated and the Client moves to another service provider, the Provider reserves the right to charge for preparing ledger reports and transferring the documentation in the amount of one monthly flat fee. The Provider will hand over the documentation within 5 days of receiving payment of all outstanding obligations.\n\n## V. FINAL PROVISIONS\n## Article 10\nThis Agreement enters into force on the date of signature and applies from {{f.startDate}}.\n\nRogatec, {{doc.date}}\n\n|| PROVIDER: __________________________ \\\\ {{firm.name}} || CLIENT: __________________________ \\\\ {{client.contact}}"}, "fields": [{"k": "firmRep", "l": "Provider represented by", "t": "text", "dsl": "direktorica Klara Boršič", "den": "director Klara Boršič"}, {"k": "included", "l": "Services included in the monthly flat fee", "t": "list", "dsl": "Obračun plač in nadomestil plač.\nObračun prispevkov za socialno varnost in poročanje institucijam (ZPIZ, DURS/FURS).\nObračun DDV ter vodenje knjig prejetih in izdanih računov.\nSvetovanje v obsegu do 1 ure na mesec.", "den": "Calculation of salaries and salary compensation.\nCalculation of social security contributions and reporting to institutions (ZPIZ, FURS).\nVAT calculation and keeping the books of received and issued invoices.\nAdvice of up to 1 hour per month."}, {"k": "extra", "l": "Additional services charged separately", "t": "list", "dsl": "Letno poročilo: Sestava letnih računovodskih izkazov (bilanca stanja, izkaz uspeha) in davčne bilance.\nSvetovanje: Kakršnokoli svetovanje, ki presega osnovni obseg 1 ure na mesec.\nPoročila za banke: Podrobnejša priprava poročil in zbiranje podatkov za finančne institucije.\nDelovna dovoljenja: Postopki pridobivanja delovnih dovoljenj za tujce.\nKadrovske storitve: Priprava pogodb o zaposlitvi ter prijave in odjave delavcev v socialna zavarovanja.", "den": "Annual report: preparation of the annual financial statements (balance sheet, income statement) and the tax return.\nAdvice: any advice beyond the basic 1 hour per month.\nReports for banks: detailed preparation of reports and collection of data for financial institutions.\nWork permits: procedures for obtaining work permits for foreign nationals.\nHR services: preparation of employment contracts and registration and deregistration of employees for social insurance."}, {"k": "payrollDay", "l": "Payroll data due by", "t": "text", "dsl": "tretjega delovnega dne", "den": "the third working day"}, {"k": "fee", "l": "Monthly flat fee in EUR (optional – adds a sentence to Article 6)", "t": "number", "dsl": "=client.fee", "den": "=client.fee"}, {"k": "payDays", "l": "Invoice payment term (days)", "t": "number", "dsl": "10", "den": "10"}, {"k": "startDate", "l": "Applies from", "t": "date", "dsl": "=today", "den": "=today"}]}, "rental": {"name": "Rental – Najem poslovnega prostora / sedež", "kind": "Rental", "numFmt": "NAJ-NN/YYYY", "source": "Starter draft – replace with your sample", "sl": {"title": "Pogodba o najemu poslovnega prostora", "body": "# POGODBA O NAJEMU POSLOVNEGA PROSTORA\n## Št. {{doc.number}}\n\nki jo skleneta\n\n**{{firm.name}}**, {{firm.address}}, {{firm.postcode}} {{firm.city}}, davčna številka: {{firm.taxNo}}, matična številka: {{firm.regNo}}, ki ga zastopa {{f.firmRep}}, v nadaljevanju najemodajalec\n\nin\n\n**{{client.name}}**, {{client.address}}, {{client.postcode}} {{client.city}}, matična številka: {{client.regNo}}, davčna številka: {{client.taxNo}}, ki ga zastopa {{client.contact}}, v nadaljevanju najemnik\n\n## 1. člen (predmet najema)\nNajemodajalec oddaja najemniku v najem poslovni prostor na naslovu {{f.premises}} v izmeri {{f.area}} m² (v nadaljevanju: poslovni prostor).\nNajemnik bo poslovni prostor uporabljal za {{f.purpose}}.\n\n## 2. člen (poslovni naslov in sedež)\nNajemodajalec soglaša, da najemnik naslov poslovnega prostora uporablja kot poslovni naslov oziroma sedež in ga vpiše v sodni oziroma poslovni register. Ta pogodba velja kot pisno soglasje lastnika za vpis poslovnega naslova.\nOb prenehanju najema mora najemnik v 30 dneh vložiti predlog za spremembo poslovnega naslova oziroma sedeža.\n\n## 3. člen (najemnina in stroški)\nMesečna najemnina znaša {{f.rent}} EUR.\n?f.rentVat {{f.rentVat}}\nNajemnik plača najemnino na podlagi računa najemodajalca do {{f.payDay}}. dne v mesecu za tekoči mesec. V primeru zamude se obračunajo zakonite zamudne obresti.\n{{f.costs}}\n?f.deposit Najemnik ob podpisu pogodbe plača varščino v višini {{f.deposit}} EUR, ki mu jo najemodajalec ob prenehanju najema vrne, zmanjšano za morebitne neporavnane obveznosti.\n\n## 4. člen (prejemanje pošte)\nNajemodajalec bo za najemnika sprejemal pošto, ki prispe na naslov poslovnega prostora, in ga o prejeti pošti obveščal {{f.mail}}.\n\n## 5. člen (obveznosti najemnika)\nNajemnik bo poslovni prostor uporabljal skrbno in v skladu z namenom najema. Brez pisnega soglasja najemodajalca ga ne bo oddajal v podnajem in v njem ne bo izvajal sprememb. Ob prenehanju najema ga bo vrnil v stanju, v kakršnem ga je prejel, upoštevaje običajno rabo.\n\n## 6. člen (trajanje in odpoved)\nPogodba je sklenjena za {{f.duration}} in se uporablja od {{f.startDate}} dalje. Vsaka pogodbena stranka jo lahko pisno odpove z odpovednim rokom {{f.notice}}.\nNajemodajalec lahko pogodbo odpove brez odpovednega roka, če najemnik dva meseca zaporedoma ne plača najemnine.\n\n## 7. člen (končne določbe)\nZa vprašanja, ki jih ta pogodba ne ureja, se uporabljajo določbe Obligacijskega zakonika. Morebitne spore bosta stranki reševali sporazumno, sicer je pristojno stvarno pristojno sodišče po sedežu najemodajalca.\nPogodba stopi v veljavo z dnem podpisa obeh strank in je sestavljena v dveh enakih izvodih, od katerih prejme vsaka stranka po enega.\n\nV Rogatcu, dne {{doc.date}}\n\n|| NAJEMODAJALEC: __________________________ \\\\ {{firm.name}} || NAJEMNIK: __________________________ \\\\ {{client.contact}}"}, "en": {"title": "Business Premises Lease Agreement", "body": "# BUSINESS PREMISES LEASE AGREEMENT\n## No. {{doc.number}}\n\nconcluded between\n\n**{{firm.name}}**, {{firm.address}}, {{firm.postcode}} {{firm.city}}, Slovenia, tax number: {{firm.taxNo}}, registration number: {{firm.regNo}}, represented by {{f.firmRep}}, hereinafter the Landlord\n\nand\n\n**{{client.name}}**, {{client.address}}, {{client.postcode}} {{client.city}}, registration number: {{client.regNo}}, tax number: {{client.taxNo}}, represented by {{client.contact}}, hereinafter the Tenant\n\n## Article 1 (Premises)\nThe Landlord leases to the Tenant the business premises at {{f.premises}}, measuring {{f.area}} m² (the Premises).\nThe Tenant will use the Premises for {{f.purpose}}.\n\n## Article 2 (Business address and registered office)\nThe Landlord agrees that the Tenant may use the address of the Premises as its business address or registered office and register it in the court or business register. This Agreement serves as the owner's written consent to the registration of the business address.\nWhen the lease ends, the Tenant must apply to change its business address or registered office within 30 days.\n\n## Article 3 (Rent and costs)\nThe monthly rent is EUR {{f.rent}}.\n?f.rentVat {{f.rentVat}}\nThe Tenant pays the rent on the basis of the Landlord's invoice by the {{f.payDay}}th day of each month for the current month. Statutory default interest is charged on late payments.\n{{f.costs}}\n?f.deposit On signing this Agreement the Tenant pays a deposit of EUR {{f.deposit}}, which the Landlord returns when the lease ends, less any unpaid amounts.\n\n## Article 4 (Receiving mail)\nThe Landlord will receive mail delivered to the address of the Premises on behalf of the Tenant and notify the Tenant of mail received {{f.mail}}.\n\n## Article 5 (Tenant's obligations)\nThe Tenant will use the Premises with care and only for the agreed purpose. Without the Landlord's written consent the Tenant will not sublet the Premises or make alterations. When the lease ends, the Tenant will return the Premises in the condition in which it received them, allowing for normal wear and tear.\n\n## Article 6 (Term and termination)\nThis Agreement is concluded for {{f.duration}} and applies from {{f.startDate}}. Either party may terminate it in writing with {{f.notice}}' notice.\nThe Landlord may terminate the Agreement without notice if the Tenant fails to pay the rent for two consecutive months.\n\n## Article 7 (Final provisions)\nMatters not regulated by this Agreement are governed by the Slovenian Obligations Code. The parties will try to resolve disputes amicably; failing that, the competent court at the Landlord's registered office has jurisdiction.\nThis Agreement enters into force when signed by both parties and is made in two identical copies, one for each party.\n\nRogatec, {{doc.date}}\n\n|| LANDLORD: __________________________ \\\\ {{firm.name}} || TENANT: __________________________ \\\\ {{client.contact}}"}, "fields": [{"k": "firmRep", "l": "Landlord represented by", "t": "text", "dsl": "direktorica Klara Boršič", "den": "director Klara Boršič"}, {"k": "premises", "l": "Address of the premises", "t": "text", "dsl": "Celjska cesta 47, 3252 Rogatec", "den": "Celjska cesta 47, 3252 Rogatec, Slovenia"}, {"k": "area", "l": "Area (m²)", "t": "number", "dsl": "", "den": ""}, {"k": "purpose", "l": "Use of the premises", "t": "text", "dsl": "opravljanje dejavnosti in kot poslovni naslov (sedež) najemnika", "den": "carrying on the Tenant's business and as the Tenant's business address (registered office)"}, {"k": "rent", "l": "Monthly rent (EUR)", "t": "number", "dsl": "", "den": ""}, {"k": "rentVat", "l": "VAT sentence (optional)", "t": "text", "dsl": "", "den": ""}, {"k": "payDay", "l": "Rent due by day of month", "t": "number", "dsl": "8", "den": "8"}, {"k": "costs", "l": "Running costs", "t": "textarea", "dsl": "Obratovalni stroški (elektrika, ogrevanje, voda in čiščenje skupnih prostorov) so vključeni v najemnino.", "den": "Running costs (electricity, heating, water and cleaning of common areas) are included in the rent."}, {"k": "deposit", "l": "Deposit (EUR, optional)", "t": "number", "dsl": "", "den": ""}, {"k": "mail", "l": "How mail is notified", "t": "text", "dsl": "po elektronski pošti", "den": "by email"}, {"k": "duration", "l": "Term", "t": "text", "dsl": "nedoločen čas", "den": "an indefinite period"}, {"k": "startDate", "l": "Applies from", "t": "date", "dsl": "=today", "den": "=today"}, {"k": "notice", "l": "Notice period", "t": "text", "dsl": "3 (treh) mesecev", "den": "3 (three) months"}]}}</script>

// ---------- company formation helpers ----------
const pkgs = () => (firm.packages && firm.packages.length) ? firm.packages : [DEFAULT_PACKAGE];
function priceOf(s){ const pk = pkgs().find(p=>p.name===s); if (pk) return {p:+pk.price||0,u:"once",pkg:pk}; if (s==="Company formation") { const p0 = pkgs()[0]; return {p:+p0.price||0,u:"once",pkg:p0}; } return firm.prices[s]||{p:0,u:"month"}; }
function newFormation(preset={}){
  const pk = pkgs()[0];
  return {id:uid(), packageName:pk.name, fee:+pk.price||0, advancePct:+pk.advancePct||50, weeksMin:+pk.weeksMin||6, weeksMax:+pk.weeksMax||12, shareholders:+pk.shareholders||1, directors:+pk.directors||2, taxOwners:+pk.taxOwners||3,
    shareCapital:7500, dates:{}, inv:{}, docs:{}, hours:[], costs:[], ...preset};
}
function fStage(f){ let s = null; for (const m of FMS) if (f.dates && f.dates[m[0]]) s = m; return s; }
function fNext(f){ return FMS.find(m=>!(f.dates||{})[m[0]]); }
function fStart(f){ const a = f.dates&&f.dates.advancePaid, d = f.dates&&f.dates.docsComplete; return a&&d ? (a>d?a:d) : null; }
function fWindow(f){ const s = fStart(f); return s ? [addDays(s,7*(+f.weeksMin||6)), addDays(s,7*(+f.weeksMax||12))] : null; }
function docValidity(f, key, days){ const d = (f.docs||{})[key]||{}; if (!days || !d.issued) return null; const exp = addDays(d.issued, days); const ref = f.plannedFiling || TODAY(); return {exp, ok: exp >= ref, ref}; }
const docsIn = f => ANNEX.filter(a=>((f.docs||{})[a[0]]||{}).status==="Received").length;
function fInvoices(f){

const LS_KEY = "practicedesk:v1";
// in-memory copy of the records with snapshot listeners (same shape as the claude.ai db)
function cacheStore(){
  const st = {data:{}}, collSubs = {}, docSubs = {};
  const snap = coll => ({docs:Object.entries(st.data[coll]||{}).map(([id,v])=>({id, data:()=>structuredClone(v)})), metadata:{fromCache:false}});
  const dsnap = (coll,id) => { const v = (st.data[coll]||{})[id]; return {exists:v!==undefined, data:()=>structuredClone(v)}; };
  st.fire = coll => { (collSubs[coll]||[]).forEach(f=>f(snap(coll))); Object.entries(docSubs).forEach(([k,fs])=>{ const [c,id] = k.split("/"); if (c===coll) fs.forEach(f=>f(dsnap(c,id))); }); };
  st.fireAll = () => { new Set([...Object.keys(collSubs), ...Object.keys(docSubs).map(k=>k.split("/")[0])]).forEach(st.fire); };
  st.onColl = (coll, fn) => { (collSubs[coll] ||= []).push(fn); fn(snap(coll)); };
  st.onDoc = (coll, id, fn) => { (docSubs[coll+"/"+id] ||= []).push(fn); fn(dsnap(coll,id)); };
  st.put = (coll, id, v) => { (st.data[coll] ||= {})[id] = v; };
  st.drop = (coll, id) => { if (st.data[coll]) delete st.data[coll][id]; };
  return st;
}
function localDb(){
  const st = cacheStore();
  const read = () => { try { st.data = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch(e){ st.data = {}; } };
  read();
  const persist = () => {
    try { localStorage.setItem(LS_KEY, JSON.stringify(st.data)); }
    catch(e){ setSync("Not saved — browser storage is full or blocked"); throw {code:"storage_full", message:"browser storage is full or blocked"}; }
  };
  window.addEventListener("storage", e => { if (e.key===LS_KEY){ read(); st.fireAll(); } });
  return {
    local:true,
    collection: coll => ({
      doc: id => ({
        set: async body => { st.put(coll, id, JSON.parse(JSON.stringify(body))); persist(); st.fire(coll); },
        delete: async () => { st.drop(coll, id); persist(); st.fire(coll); },
        onSnapshot: fn => st.onDoc(coll, id, fn)
      }),
      onSnapshot: fn => st.onColl(coll, fn)
    }),
    load: async (d, merge) => { st.data = merge ? Object.fromEntries([...new Set([...Object.keys(st.data), ...Object.keys(d)])].map(c=>[c, {...(st.data[c]||{}), ...(d[c]||{})}])) : d; persist(); st.fireAll(); }
  };
}

const sbErr = e => { const m = e && (e.message || e.code) || String(e); return {code: e && e.code==="42501" ? "you don't have access (ask the administrator)" : m, message: m}; };
function supaDb(){
  const st = cacheStore();
  let down = false;
  async function loadAll(){
    const fresh = {}, N = 1000;
    for (let from = 0; ; from += N) {
      const {data:rows, error} = await sb.from("records").select("coll,id,data").order("coll").order("id").range(from, from+N-1);
      if (error) throw sbErr(error);
      rows.forEach(r => { (fresh[r.coll] ||= {})[r.id] = r.data; });
      if (rows.length < N) break;
    }
    st.data = fresh; st.fireAll();
  }
  const live = () => setSync("Saved online · synced live");
  const channel = sb.channel("records-sync")
    .on("postgres_changes", {event:"*", schema:"public", table:"records"}, p => {
      if (p.eventType==="DELETE") { const o = p.old||{}; if (o.coll) { st.drop(o.coll, o.id); st.fire(o.coll); } }
      else if (p.new && p.new.coll) { st.put(p.new.coll, p.new.id, p.new.data); st.fire(p.new.coll); }
    })
    .subscribe(status => {
      if (status==="SUBSCRIBED") { if (down) { down = false; loadAll().then(live).catch(()=>{}); } else live(); }
      else if (status==="CHANNEL_ERROR" || status==="TIMED_OUT" || status==="CLOSED") { down = true; setSync("Connection lost — reconnecting…"); }
    });
  window.addEventListener("online", () => { loadAll().catch(()=>{}); });
  const upsert = async rows => { for (let i = 0; i < rows.length; i += 500) { const {error} = await sb.from("records").upsert(rows.slice(i, i+500)); if (error) throw sbErr(error); } };
  return {
    online:true, ready: loadAll(), channel,
    collection: coll => ({
      doc: id => ({
        set: async body => { const data = JSON.parse(JSON.stringify(body)); await upsert([{coll, id, data}]); st.put(coll, id, data); st.fire(coll); },
        delete: async () => { const {error} = await sb.from("records").delete().eq("coll", coll).eq("id", id); if (error) throw sbErr(error); st.drop(coll, id); st.fire(coll); },
        onSnapshot: fn => st.onDoc(coll, id, fn)
      }),
      onSnapshot: fn => st.onColl(coll, fn)
    }),
    load: async (d, merge) => {
      if (!merge) for (const c of COLLS) {
        const gone = Object.keys(st.data[c]||{}).filter(id => !(d[c]||{})[id]);
        for (let i = 0; i < gone.length; i += 200) { const {error} = await sb.from("records").delete().eq("coll", c).in("id", gone.slice(i, i+200)); if (error) throw sbErr(error); }
      }
      const rows = []; for (const c of Object.keys(d)) for (const [id, data] of Object.entries(d[c]||{})) rows.push({coll:c, id, data});
      await upsert(rows); await loadAll();
    }
  };
}

async function authSubmit(e){

    const {data:mem, error:me2} = await sb.from("members").select("name,role,email").eq("user_id", session.user.id).maybeSingle();

    hideAuth(); startOnline();
  } catch(e){ authView("error", {msg:"Can't reach the database: " + (e.message||e)}); }
}

// ---------- client email list (company -> email(s)), pasted or imported ----------
function parseClientEmails(text){
  return String(text||"").replace(/\r/g,"").split("\n").map(line=>{
    const emails = (line.match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/g)||[]).map(e=>e.toLowerCase());
    const name = line.replace(/[\w.+-]+@[\w-]+(\.[\w-]+)+/g,"").split(/\t|;|,|\s{2,}/)[0].trim();
    return {name, emails:[...new Set(emails)]};
  }).filter(x=>x.name && x.emails.length && !/^(podjetje|company|naziv|stranka)$/i.test(x.name));
}
function planClientEmails(list){
  const plan = {update:[], add:[], same:[], unsure:[]};
  for (const x of list){
    const n = normName(x.name);
    let hits = state.clients.filter(c=>normName(c.name)===n);
    if (!hits.length && n.length>=4) hits = state.clients.filter(c=>{ const cn = normName(c.name); return cn.length>=4 && (cn.startsWith(n) || n.startsWith(cn)); });
    if (hits.length>1) { plan.unsure.push({...x, why:`matches ${hits.map(c=>c.name).join(", ")}`}); continue; }
    const c = hits[0];
    if (!c) { plan.add.push(x); continue; }
    const have = clientEmails(c), extra = x.emails.filter(e=>!have.includes(e));
    if (extra.length) plan.update.push({c, x, extra}); else plan.same.push(x);
  }
  const all = list.flatMap(x=>x.emails), shared = [...new Set(all.filter((e,i)=>all.indexOf(e)!==i))];
  return {...plan, shared};
}
async function applyClientEmails(plan){
  for (const {c, extra} of plan.update){
    const r = {...c}; const rest = [...extra];
    if (!emailOf(r.email)) r.email = rest.shift();
    if (rest.length) r.otherEmails = [...String(r.otherEmails||"").split(/[,;\s]+/).filter(Boolean), ...rest].join(", ");
    await save("clients", r);
  }
  for (const x of plan.add){
    const entity = /\bd\.?\s?o\.?\s?o\.?/i.test(x.name) ? "d.o.o." : /\bs\.?\s?p\.?\b/i.test(x.name) ? "s.p." : "";
    await save("clients", newRecord("clients", {name:x.name, entity, email:x.emails[0], otherEmails:x.emails.slice(1).join(", "), status:"Active", country:"Slovenija", source:"Email list"}));
  }
}
function clientEmailsSummary(plan){
  const lines = [];
  if (plan.update.length) lines.push(`Add emails to ${plan.update.length} existing client${plan.update.length>1?"s":""}: ${plan.update.map(u=>u.c.name).join(", ")}`);
  if (plan.add.length) lines.push(`Create ${plan.add.length} new client${plan.add.length>1?"s":""}: ${plan.add.map(x=>x.name).join(", ")}`);
  if (plan.same.length) lines.push(`Already up to date: ${plan.same.length}`);
  if (plan.unsure.length) lines.push(`Skipped (name matches more than one client): ${plan.unsure.map(x=>`${x.name} – ${x.why}`).join("; ")}`);
  if (plan.shared.length) lines.push(`Shared by more than one company (emails from these are matched by company name, not address): ${plan.shared.join(", ")}`);
  return lines;
}

async function importBackup(text, name){
  let j; try { j = JSON.parse(text); } catch(e){ toast("That file isn't a Practice Desk backup"); return; }
  if (j && Array.isArray(j.clientEmails)) { const plan = planClientEmails(j.clientEmails.map(x=>({name:x.name, emails:[].concat(x.emails||x.email||[]).map(e=>emailOf(e)).filter(Boolean)})));
    if (!plan.update.length && !plan.add.length) { toast("All client emails are already up to date"); return; }
    if (!confirm(clientEmailsSummary(plan).join("\n\n") + "\n\nNothing else is changed. Continue?")) return;
    try { await applyClientEmails(plan); toast(`Updated ${plan.update.length}, added ${plan.add.length} clients`); } catch(e){ toast("Import failed: " + (e.message||e.code||e)); } return; }
  const d = j && j.data; if (!d || typeof d!=="object") { toast("That file isn't a Practice Desk backup"); return; }
  const n = COLLS.reduce((s,c)=>s+Object.keys(d[c]||{}).length, 0);
  if (j.mergeOnly || j.addOnly) {
    // link imported records to existing clients: by any of the client's emails, then by name
    const linked = new Set(), skipped = [];
    const findClient = r => { for (const e of [].concat(r.matchEmails||[])) { const c = clientByEmail(e); if (c) return c; }
      const m = normName(r.matchClient); if (m.length>=4) { const hits = state.clients.filter(c=>{ const cn = normName(c.name); return cn.length>=4 && (cn.includes(m) || m.includes(cn)); }); if (hits.length===1) return hits[0]; } return null; };
    for (const coll of ["proposals","requests","aml","documents","formations"]) for (const r of Object.values(d[coll]||{})) {
      if (!r.clientId && (r.matchClient || r.matchEmails)) { const c = findClient(r); if (c) { r.clientId = c.id; linked.add(c.name); } }
      delete r.matchClient; delete r.matchEmails; }
    // leads from someone who is already a client are skipped: those belong in requests
    for (const [id, l] of Object.entries(d.leads||{})) { const c = clientByEmail(l.email); if (c) { skipped.push(`${l.name||l.email} (already client ${c.name})`); delete d.leads[id]; } }
    // requests already written by hand: same client, similar subject, close date (or same case number)
    const words = t => new Set(String(t||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").split(/[^a-z0-9]+/).filter(w=>w.length>2 && !["the","and","for","fwd","re","za","in","na","od","pri"].includes(w)));
    const sim = (a,b) => { const A = words(a), B = words(b); if (!A.size || !B.size) return 0; let n = 0; A.forEach(w=>{ if (B.has(w)) n++; }); return n / Math.min(A.size, B.size); };
    const days = (a,b) => a && b ? Math.abs((new Date(a) - new Date(b)) / 864e5) : 99;
    let already = 0;
    for (const [id, r] of Object.entries(d.requests||{})) {
      if (state.requests.some(x=>x.id===id || (r.gmailThreadId && x.gmailThreadId===r.gmailThreadId))) continue;
      const cands = state.requests.filter(x=>r.clientId && x.clientId===r.clientId && days(x.received||x.createdAt, r.received) <= 21);
      const best = cands.map(x=>({x, s: (r.caseRef && x.caseRef && r.caseRef===x.caseRef) ? 1 : Math.max(sim(x.subject, r.subject), sim(x.subject+" "+(x.notes||""), r.subject+" "+(r.type||"")) * 0.9)})).sort((a,b)=>b.s-a.s)[0];
      if (best && best.s >= 0.75) { delete d.requests[id]; already++; }
      else if (best && best.s >= 0.4) r.review = [r.review, `Possibly already in Requests: “${best.x.subject}” (${fmtDate(best.x.received)})`].filter(Boolean).join(" · ");
    }
    for (const [id, l] of Object.entries(d.leads||{})) { if (state.leads.some(x=>x.id!==id && ((l.email && emailOf(x.email)===emailOf(l.email)) || (l.name && normName(x.name)===normName(l.name))))) { delete d.leads[id]; already++; } }
    // add only: never overwrite something already in Practice Desk (re-importing the same email does nothing)
    let dup = 0; if (j.addOnly) for (const c of Object.keys(d)) for (const id of Object.keys(d[c]||{})) { const have = (state[c]||[]).some(x=>x.id===id) || (c==="requests" && d[c][id].gmailThreadId && state.requests.some(x=>x.gmailThreadId===d[c][id].gmailThreadId)); if (have) { delete d[c][id]; dup++; } }
    const n2 = COLLS.reduce((s,c)=>s+Object.keys(d[c]||{}).length, 0);
    if (!n2) { toast(dup||already ? `Nothing new: ${dup+already} already in Practice Desk` : "Nothing to add"); return "done"; }
    const flagged = COLLS.reduce((s,c)=>s+Object.values(d[c]||{}).filter(x=>x.review).length, 0);
    const parts = COLLS.filter(c=>Object.keys(d[c]||{}).length).map(c=>`${Object.keys(d[c]).length} ${c}`).join(", ");
    if (!confirm(`Add ${parts} from ${name}?${linked.size?`\n\nLinked to existing clients: ${[...linked].join(", ")}.`:""}${dup?`\n${dup} already imported before – skipped.`:""}${already?`\n${already} already written in Requests / Leads – skipped.`:""}${flagged?`\n${flagged} marked purple “Check” for you to verify.`:""}${skipped.length?`\nNot added as leads (already clients): ${skipped.join(", ")}.`:""}\n\nNothing else is changed.`)) return "cancel";
    const n = n2;
    try { if (db && db.load) await db.load(d, true); toast(`Added ${n} record${n===1?"":"s"}`); return "done"; } catch(e){ toast("Import failed: " + (e.message||e.code||e)); return "error"; }
  }
  const replace = confirm(`Restore ${n} records from ${name}?\n\nOK = replace everything currently in Practice Desk with the backup.\nCancel = choose whether to merge instead.`);
  if (!replace && !confirm("Merge the backup into your current records instead? Records with the same id are overwritten by the backup.")) return;
  try {
    if (db && db.load) { toast("Restoring…"); await db.load(d, !replace); }
    else if (db) {
      if (replace) for (const c of COLLS) for (const r of state[c]) if (!(d[c]||{})[r.id]) await db.collection(c).doc(r.id).delete();
      for (const c of [...COLLS, "settings"]) for (const [id, r] of Object.entries(d[c]||{})) await db.collection(c).doc(id).set(r);
    } else { toast("Storage isn't available"); return; }
    toast(`Restored ${n} records`);
  } catch(e){ toast("Restore failed: " + (e.message||e.code||e)); }
}

// website booking form ("Nova rezervacija posveta"): the sender is the website, the person is in the form
function parseWebForm(text, subject=""){
  const t = String(text||"").replace(/\r/g,"");
  const field = label => { const m = t.match(new RegExp(label + "\\s*:?[ \\t]*([^\\n]*)(?:\\n+[ \\t]*([^\\n]+))?", "i")); if (!m) return ""; const v = (m[1]||"").trim(); return v || (m[2]||"").trim(); };
  // recognised by content only (the sending address also sends other mail): the booking heading or subject, plus the form fields
  const marker = /rezervacija (brezplačnega )?posveta|s spletne strani/i.test(subject + "\n" + t);
  const name = field("Ime in priimek"), contact = field("Kontakt");
  if (!marker || (!name && !contact)) return null;
  const email = emailOf(contact), phone = email ? "" : (contact.match(/\+?[\d][\d\s/().-]{5,}\d/)||[""])[0].trim();
  const lj = field("Jezik strani"), when = field("Čas oddaje");
  return {name: name || String(subject).replace(/^.*?:\s*/,"").trim(), email, phone, lang: !lj || /sloven/i.test(lj) ? "sl" : "en", langLabel: lj, when};
}

      if (r && typeof r==="object") ex = {...ex, ...r};
    } catch(e){}
  }
  const link = item.pasted ? {} : {gmailThreadId:item.id, gmailMsgId:item.msgId, gmailUrl:item.url};

  }

function amlStatus(){

    const checks = state.aml.filter(a=>a.clientId===c.id).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const last = checks[0];
    return {client:c, last, due: last ? daysUntil(last.nextReview) : null, missing: !last};
  });

const MONTHS_EN = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function yearStats(y){
  const months = MONTHS_EN.map((name,i)=>({m:`${y}-${String(i+1).padStart(2,"0")}`, name, n:0, done:0, open:0, work:0, invoiced:0}));
  state.requests.filter(r=>!r.example && reqMonth(r).startsWith(y+"-")).forEach(r=>{
    const row = months[+reqMonth(r).slice(5,7)-1]; if (!row) return;
    row.n++; if (r.status==="Done") row.done++; else row.open++;
    const w = workTotal(r); row.work += w; if (r.invoicedOn) row.invoiced += w;
  });
  const tot = months.reduce((a,x)=>({n:a.n+x.n, done:a.done+x.done, open:a.open+x.open, work:a.work+x.work, invoiced:a.invoiced+x.invoiced}), {n:0,done:0,open:0,work:0,invoiced:0});
  return {months, tot};
}
function yearCsv(y){
  const {months, tot} = yearStats(y), n = v => String(Math.round(v*100)/100).replace(".",",");
  const head = ["Mesec","Zahtevki","Opravljeni","Odprti","Dodatno delo (brez DDV)","Zaračunano","Ni zaračunano"];
  const rows = months.map(x=>[x.m, x.n, x.done, x.open, n(x.work), n(x.invoiced), n(x.work-x.invoiced)]);
  rows.push([`SKUPAJ ${y}`, tot.n, tot.done, tot.open, n(tot.work), n(tot.invoiced), n(tot.work-tot.invoiced)]);
  return toCsvRows([head,...rows]);
}

function parseCsv(text){
  text = text.replace(/^﻿/,"");
  const first = text.split(/\r?\n/)[0]||"";
  const sep = (first.match(/;/g)||[]).length >= (first.match(/,/g)||[]).length ? ";" : ",";
  const rows = []; let row = [], cell = "", q = false;
  for (let i=0;i<text.length;i++){ const ch = text[i];
    if (q){ if (ch==='"'){ if (text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if (ch==='"') q=true; else if (ch===sep){ row.push(cell); cell=""; } else if (ch==="\n"||ch==="\r"){ if (ch==="\r"&&text[i+1]==="\n") i++; row.push(cell); rows.push(row); row=[]; cell=""; } else cell+=ch; }
  if (cell||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()));
}
const IMPMAP = [["vatPayer",["zavezanec"]],["taxNo",["davčna","davcna","id za ddv","tax","vat id","ddv št"]],["regNo",["matična","maticna","registration","reg. no"]],["postcode",["poštna","postna","postcode","zip","pošta"]],["city",["kraj","city","mesto"]],["country",["država","drzava","country"]],["email",["e-pošta","e-posta","email","e-mail"]],["phone",["telefon","phone","tel."]],["iban",["trr","iban","transakcijski"]],["contact",["kontakt","contact"]],["address",["naslov","address","ulica"]],["name",["naziv","name","partner","firma","ime"]]];
function prepImport(text, file){
  const rows = parseCsv(text); if (!rows.length) { toast("That file is empty"); return; }
  const head = rows[0].map(h=>h.trim().toLowerCase()); const map = {}; const used = new Set();
  for (const [k,toks] of IMPMAP){ const i = head.findIndex((h,ix)=>!used.has(ix) && toks.some(t=>h.includes(t))); if (i>=0){ map[k]=i; used.add(i); } }
  if (map.name===undefined){ toast("Couldn't find a name column (Naziv / Name) in that file"); return; }
  const recs = rows.slice(1).map(r=>{ const o={}; for (const k in map) o[k]=(r[map[k]]||"").trim(); if (o.vatPayer!==undefined) o.vatPayer = /^(da|yes|1|true|d)$/i.test(o.vatPayer)?"Yes":"No"; return o; }).filter(o=>o.name);
  const norm = s => String(s||"").replace(/\D/g,"");
  const upd = [], newRows = [];
  for (const o of recs){ const ex = state.clients.find(c=>(o.taxNo && norm(c.taxNo)===norm(o.taxNo) && norm(o.taxNo)) || c.name.trim().toLowerCase()===o.name.toLowerCase()); if (ex) upd.push([ex,o]); else newRows.push(o); }
  importPreview = {file, rows:recs, map:Object.fromEntries(Object.entries(map).map(([k,i])=>[rows[0][i],k])), upd, newRows};
  render();
}
function readFirmForm(form){

async function applyImport(){

const PLACEHOLDERS = ["firm.name","firm.address","firm.postcode","firm.city","firm.taxNo","firm.regNo","firm.iban","firm.email","firm.phone","firm.signatoryName","firm.signatoryRole","firm.court","firm.hourly","client.name","client.address","client.postcode","client.city","client.country","client.taxNo","client.regNo","client.bizRegNo","client.contact","client.contactRole","client.email","client.iban","client.fee","client.activity","doc.number","doc.date"];
function tplNumber(tpl){
  const y = new Date().getFullYear(), fmt = tpl.numFmt || "NN/YYYY";
  const n = state.documents.filter(d=>d.templateId===tpl.id && String(d.date||"").startsWith(String(y))).length + 1;
  return fmt.replace(/YYYY/g, y).replace(/N{2,}/, m => String(n).padStart(m.length,"0"));
}
function tplCtx(c){
  const F = firm, p = c.party||{}, sig = splitSig(F.signatory), lang = c.lang;
  const m = {"firm.name":F.name,"firm.address":F.address,"firm.postcode":F.postcode,"firm.city":F.city,"firm.taxNo":F.taxNo,"firm.regNo":F.regNo,"firm.iban":F.iban,"firm.email":F.email,"firm.phone":F.phone,"firm.signatoryName":sig.name,"firm.signatoryRole":sig.role,"firm.court":F.court||F.city,"firm.hourly":F.hourly,
    "client.name":p.name,"client.address":p.address,"client.postcode":p.postcode,"client.city":p.city,"client.country":p.country,"client.taxNo":p.taxNo,"client.regNo":p.regNo,"client.bizRegNo":p.bizRegNo,"client.contact":p.contact,"client.contactRole":p.contactRole,"client.email":p.email,"client.iban":p.iban,"client.fee":p.fee,"client.activity":p.activity,
    "doc.number":c.number,"doc.date":dfmt(c.date,lang)};
  const tpl = byId("templates", c.tplId) || {fields:[]};
  for (const f of tpl.fields||[]) { const v = c.vals[f.k]; m["f."+f.k] = f.t==="date" ? dfmt(v,lang) : f.t==="number" && v!=="" && v!=null ? new Intl.NumberFormat(lang==="sl"?"sl-SI":"en-IE",{maximumFractionDigits:2}).format(+v) : (v ?? ""); }
  return m;
}
function fieldDefault(f, lang, p){
  let d = lang==="sl" ? f.dsl : f.den; if (d==null || d==="") d = lang==="sl" ? f.den : f.dsl;
  d = d ?? "";
  if (String(d).startsWith("=")) { const k = String(d).slice(1).trim();
    if (k==="today") return TODAY();
    if (k.startsWith("client.")) return (p||{})[k.slice(7)] ?? "";
    if (k.startsWith("firm.")) return firm[k.slice(5)] ?? "";
    return ""; }
  return d;
}

}
function renderTpl(src, ctx){
  const lines = String(src||"").split(/\r?\n/);
  let html = "", list = null, ord = null;
  const flush = () => { if (list){ html += `<${list.t}>${list.items.map(i=>`<li>${i}</li>`).join("")}</${list.t}>`; list = null; } };
  const blank = "________________";
  const fill = s => { // escape template text, apply **bold** / *italic*, then substitute escaped values
    let out = esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g,"$1<i>$2</i>");
    return out.replace(/\{\{\s*([\w.]+)\s*\}\}/g, (m,k) => { const v = ctx[k]; return (v===undefined||v===null||v==="") ? blank : esc(v).replace(/\n/g,"<br>"); });
  };
  const push = (t, item) => { if (!list || list.t!==t){ flush(); list = {t, items:[]}; } list.items.push(item); };
  for (let raw of lines){
    let line = raw.replace(/\s+$/,"");
    const cond = line.match(/^\?([\w.]+)\s+(.*)$/);
    if (cond){ const v = ctx[cond[1].startsWith("f.")||cond[1].includes(".")?cond[1]:"f."+cond[1]]; if (v===undefined||v===null||v==="") continue; line = cond[2]; }
    const t = line.trim();
    if (!t){ flush(); continue; }
    const lp = t.match(/^-\s*\{\{\s*([\w.]+)\s*\}\}$/);
    if (lp && String(ctx[lp[1]]||"").includes("\n")){ String(ctx[lp[1]]).split("\n").map(x=>x.replace(/^\s*[-•]\s*/,"").trim()).filter(Boolean).forEach(x=>push("ul", esc(x))); continue; }
    if (t==="===" ){ flush(); html += `<p class="pb" style="break-before:page;page-break-before:always;margin:0"></p>`; continue; }
    if (t.startsWith("||")){ flush(); const cells = t.split("||").slice(1).map(x=>x.trim()); html += `<table class="sigt"><tr>${cells.map(cl=>`<td>${cl.split("\\\\").map(x=>fill(x.trim())).join("<br>")}</td>`).join("")}</tr></table>`; continue; }
    if (t.startsWith("### ")){ flush(); html += `<h5>${fill(t.slice(4))}</h5>`; continue; }
    if (t.startsWith("## ")){ flush(); html += `<h4>${fill(t.slice(3))}</h4>`; continue; }
    if (t.startsWith("# ")){ flush(); html += `<h1>${fill(t.slice(2))}</h1>`; continue; }
    if (/^[-•]\s+/.test(t)){ push("ul", fill(t.replace(/^[-•]\s+/,""))); continue; }
    if (/^\d+[.)]\s+/.test(t)){ push("ol", fill(t.replace(/^\d+[.)]\s+/,""))); continue; }
    flush(); html += `<p>${fill(t)}</p>`;
  }
  flush();
  return html;
}

function refreshPaper(){ const p = document.getElementById("paper"); if (p){ p.innerHTML = docHtml(comp); comp.edited=false; } }
async function makePdf(){
  const el = document.getElementById("paper");
  if (!window.html2pdf) throw new Error("PDF tool didn't load");
  const opt = {margin:[0,0,0,0], filename:"doc.pdf", image:{type:"jpeg",quality:0.82}, html2canvas:{scale:1.6,backgroundColor:"#ffffff",useCORS:false}, jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}, pagebreak:{mode:["css","legacy"],avoid:[".clause","tr",".fld",".sig"]}};
  const shadow = el.style.boxShadow; el.style.boxShadow="none";
  try { return await window.html2pdf().set(opt).from(el).outputPdf("blob"); } finally { el.style.boxShadow = shadow; }
}
const b64 = blob => new Promise((res,rej)=>{ const r = new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(blob); });
const fileName = (c, ext="pdf") => `${c.number}_${c.party.name||"blank"}`.replace(/[^\p{L}\p{N}._-]+/gu,"_").slice(0,80) + "." + ext;
async function compDraft(){
  const c = comp; if (c.busy) return;
  if (!emailOf(c.to)){ c.msg = "Add the client's email address in “Send to” first."; renderComposer(); return; }
  c.busy = true; c.msg = "Making the PDF…"; const paperHtml = document.getElementById("paper").innerHTML; renderComposer(); document.getElementById("paper").innerHTML = paperHtml;
  try {
    const blob = await makePdf();
    const name = fileName(c);
    let draftUrl = "", status = "Draft in Gmail";
    if (!mcp) {
      await downloads.save({filename:name, data:blob});
      const a = document.createElement("a"); a.href = `mailto:${encodeURIComponent(emailOf(c.to))}?subject=${encodeURIComponent(c.subject||"")}&body=${encodeURIComponent(c.body||"")}`; document.body.appendChild(a); a.click(); a.remove();
      status = "Sent";
    } else {
    c.msg = "Creating the Gmail draft…"; renderComposer(); document.getElementById("paper").innerHTML = paperHtml;
    const content = fileArgs ? {$file:{data:blob, name, type:"application/pdf"}} : await b64(blob);
    if (!fileArgs && content.length > 950000) throw new Error("The PDF is too large to attach from here. Use Save PDF and attach it in Gmail.");
    const html = esc(c.body).replace(/\n/g,"<br>");
    const input = {to:[emailOf(c.to)], subject:c.subject, body:c.body, htmlBody:`<div>${html}</div>`, attachments:[{filename:name, mimeType:"application/pdf", content}], includeSignature:false};
    const rec = byId(c.coll, c.id);
    if (rec && rec.gmailMsgId && c.type==="quote") input.replyToMessageId = rec.gmailMsgId;
    const d = await gmail("create_draft", input);
    draftUrl = d && (d.viewUrl || (d.message && d.message.viewUrl)) || "https://mail.google.com/mail/#drafts";
    }
    const oneOff = c.items.filter(i=>i.u==="once"||i.u==="year").reduce((s,i)=>s+i.q*i.p,0);
    await save("documents", {id:uid(), type:c.type, number:c.number, lang:c.lang, refColl:c.coll, refId:c.id, party:c.party.name, email:emailOf(c.to), date:c.date, status, draftUrl, title:c.type==="contract"?(((byId("templates",c.tplId)||{})[c.lang]||{}).title||""):"", templateId:c.tplId||"", monthly:c.type==="quote"?monthlyOf(c.items):c.type==="agreement"?+c.fee:0, amount:c.type==="formation"?(+c.fm.fee||0):c.type==="quote"?oneOff:0});
    if (c.fm && rec) {
      const upd = {...rec, packageName:c.fm.packageName, fee:c.fm.fee, advancePct:c.fm.advancePct, taxOwners:c.fm.taxOwners, shareholders:c.fm.shareholders, directors:c.fm.directors, weeksMin:c.fm.weeksMin, weeksMax:c.fm.weeksMax, proposalDate:c.proposalDate||rec.proposalDate||""};
      if (c.type==="docrequest") { upd.docs = structuredClone(rec.docs||{}); ANNEX.forEach(([k])=>{ const d = upd.docs[k]||{}; if ((d.status||"Missing")==="Missing") upd.docs[k] = {...d, status:"Requested"}; }); }
      await save("formations", upd);
    }
    await recordQuote(c);
    if (c.type==="quote" && c.coll==="leads" && rec && ["new","contacted","meeting"].includes(rec.stage)) await save("leads", {...rec, stage:"proposal", fee: monthlyOf(c.items)||rec.fee, nextDate:addDays(TODAY(),7), nextAction:"Follow up on quote "+c.number});
    if (c.type==="agreement" && rec && c.coll==="clients" && +c.fee && !rec.fee) await save("clients", {...rec, fee:+c.fee});
    comp = null; renderDrawer();
    if (!mcp) { toast(`PDF saved as ${name}. Attach it to the email that opened in your mail app and press Send.`); return; }
    toast("Draft created in Gmail. Review it there and press Send.");
    if (draftUrl) setTimeout(()=>{ const t = document.querySelector(".toast"); if (t) t.innerHTML = `Draft created. <a href="${esc(draftUrl)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">Open in Gmail</a>`; }, 50);
  } catch(e){
    c.busy = false; c.msg = e && e.code ? gmailErr(e) : ("Couldn't create the draft: " + (e.message||e));
    renderComposer(); document.getElementById("paper").innerHTML = paperHtml;
  }

// ---------- CSV export ----------
function toCsv(coll){
  const fields = SCHEMA[coll].fields.filter(f=>f.t!=="risk");
  const head = fields.map(f=>f.l); if (coll==="aml") head.push("Risk level","Risk score");
  const rows = state[coll].map(r=>{ const out = fields.map(f=>f.k==="clientId"?clientName(r[f.k]):f.t==="work"?String(workTotal(r)).replace(".",","):f.t==="lines"?(r.lines||[]).map(l=>`${l.group?"["+l.group+"] ":""}${l.s}: ${priceText(l,"sl")}${+l.q&&+l.q!==1&&l.u!=="pct"?` × ${String(+l.q).replace(".",",")}`:""}`).join(" | "):r[f.k]); if (coll==="aml"){const k=riskOf(r); out.push(k.level,k.score);} return out; });
  return toCsvRows([head,...rows]);
}
async function offer(filename, data){
  if (!downloads){ toast("Saving files isn't available in this view"); return; }
  try { await downloads.save({filename, data}); toast("Saved " + filename); } catch(e){ if (!e || e.code!=="cancelled") toast("The file wasn't saved"); }
}

  if (e.target.id==="ct_client"){ ctClient = e.target.value; render(); }
  if (e.target.dataset.docstatus){ const d = byId("documents", e.target.dataset.docstatus); if (d) save("documents", {...d, status:e.target.value}).then(()=>toast("Status updated")).catch(err=>toast("Couldn't save: "+(err.code||err))); }
  if (e.target.id==="restorefile" && e.target.files[0]){ const f = e.target.files[0]; f.text().then(t=>importBackup(t, f.name)); e.target.value=""; }
  if (e.target.id==="impfile" && e.target.files[0]){ const f = e.target.files[0]; f.text().then(t=>prepImport(t, f.name)); e.target.value=""; }
});
document.addEventListener("submit", async e => {
  if (e.target.closest && e.target.closest("#auth")) return;
  e.preventDefault();
  if (e.target.id==="pasteform"){
    const fd = new FormData(e.target), as = (e.submitter && e.submitter.value) || "lead";
    const from = String(fd.get("from")||"").trim(), subject = String(fd.get("subject")||"").trim(), body = String(fd.get("body")||"").trim();
    if (!from && !body){ toast("Paste the sender or the message first"); return; }
    const em = emailOf(from), cl = em && clientByEmail(em);
    const item = {id:"", from, email:em, name:nameOf(from) || (em ? "" : from), subject, snippet:body, date:TODAY(), clientId:cl?cl.id:"", pasted:true};
    e.target.reset(); fromMail(item, as);
    return;
  }
  if (e.target.id==="firmform"){
    readFirmForm(e.target);
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
    try { await saveFirm(); setupDirty = false; toast("Firm settings saved"); } catch(err){ toast("Couldn't save: "+(err.code||err)); }
    return;
  }
  if (!drawer) return;
  if (drawer.coll==="templates"){
    const r = drawer.rec;
    if (!String(r.name||"").trim()){ toast("Give the template a name"); return; }
    const keys = (r.fields||[]).map(f=>f.k); if (new Set(keys).size!==keys.length || keys.some(k=>!/^[A-Za-z]\w*$/.test(k||""))){ toast("Field keys must be unique, start with a letter and use only letters, digits and _"); return; }
    try { await save("templates", r); drawer=null; renderDrawer(); toast("Template saved"); } catch(err){ toast("Couldn't save: "+(err.code||err)); }
    return;
  }
  if (drawer.coll==="formations"){
    const r = drawer.rec;
    if (!r.clientId){ toast("Choose the client first"); document.getElementById("fp_clientId").focus(); return; }
    const isNew = drawer.isNew;
    try { await save("formations", r); drawer=null; renderDrawer(); toast(isNew?"Company formation added":"Saved"); }
    catch(err){ toast(err && err.code==="invalid_argument" ? "You have view-only access, so changes can't be saved" : "Couldn't save: "+(err.code||err)); }
    return;
  }
  const r = readForm(); const S = SCHEMA[drawer.coll];
  const miss = S.fields.find(f=>f.req && !r[f.k]);
  if (miss){ toast(`${miss.l} is required`); const el=document.getElementById("f_"+miss.k); if (el) el.focus(); return; }
  if (drawer.coll==="aml"){ const k = riskOf(r); r.riskLevel = k.level; r.riskScore = k.score; if (!r.nextReview) r.nextReview = addMonths(r.date||TODAY(), k.months); }
  if (drawer.coll==="proposals") {
    if (!r.clientId && !String(r.party||"").trim()){ toast("Choose a client or enter the prospect's name"); return; }
    const bad = (r.lines||[]).findIndex(l=>!String(l.s||"").trim());
    (r.lines||[]).forEach(l=>{ if (l.u!=="item") delete l.unitLabel; if (l.u!=="pct") delete l.min; else { l.q = 1; delete l.from; delete l.max; } if (!(+l.max>+l.p)) delete l.max; if (!l.from) delete l.from; l.group = String(l.group||"").trim(); if (!l.group) delete l.group; });
    if (r.status==="Accepted" && propGroups(r).length>1 && !(r.accepted||[]).length){ toast("Tick which options / sections the client accepted"); renderDrawer(); const f = document.querySelector('[name="accepted"]'); if (f) f.focus(); return; }
    if (r.status!=="Accepted") delete r.accepted;
    if (bad>=0){ toast("Name the service in each row, or remove the empty row"); const el = document.querySelector(`[data-l="lines.${bad}.s"]`); if (el) el.focus(); return; }
    if ((r.status==="Accepted"||r.status==="Declined") && !r.decidedOn) r.decidedOn = TODAY();
  }
  if (drawer.coll==="requests") {
    const bad = (r.work||[]).findIndex(w=>!String(w.desc||"").trim());
    if (bad>=0){ toast("Describe the work in each row, or remove the empty row"); const el = document.querySelector(`[data-w="work.${bad}.desc"]`); if (el) el.focus(); return; }
    if (!r.billMonth) r.billMonth = String(r.received||TODAY()).slice(0,7);
    if (r.status==="Done" && !r.doneOn) r.doneOn = TODAY();
    if (r.status!=="Done") r.doneOn = "";
  }
  if (drawer.coll==="requests" && !r.due && r.received) r.due = addDays(r.received, r.priority==="Urgent"?1:r.priority==="High"?3:7);
  const coll = drawer.coll, isNew = drawer.isNew, after = drawer.after;
  try { await save(coll, r); drawer=null; renderDrawer(); if (after) await after(r); render(); toast(isNew?`${S.one[0].toUpperCase()+S.one.slice(1)} added`:"Saved"); }
  catch(err){ toast(err && err.code==="invalid_argument" ? "You have view-only access, so changes can't be saved" : "Couldn't save: "+(err.code||err)); }
});
const VIEWS = ["overview","inbox","leads","clients","formations","proposals","contracts","aml","requests","documents","setup"];
function route(){ const h = location.hash.slice(1); view = VIEWS.includes(h)?h:"overview"; filter.q=""; importPreview = view==="setup"?importPreview:null; render(); }
window.addEventListener("hashchange", route);
route(); boot();
})();
